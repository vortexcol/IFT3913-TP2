name: GraphHopper Mutation CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - name: Build and run unit tests
        run: mvn -B test

      - name: Run PIT and check mutation score
        run: bash scripts/check-mutation-score.sh

  rickroll-on-failure:
    runs-on: ubuntu-latest
    needs: build-and-mutation
    if: failure()   # Only run this job if build-and-mutation failed

    steps:
      - name: Rickroll when tests fail
        uses: TejasvOnly/random-rickroll@v1.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 100% chance of Rickroll on failure 😈
          percentage: 100
          # fun message shown in the action logs
          message: |
            Your GraphHopper tests failed…
            But we’re never gonna give you up
